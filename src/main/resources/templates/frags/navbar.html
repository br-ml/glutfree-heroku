<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">



<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-nav rounded">
    <a href="/">
        <img src="/img/Logo.png" alt="GlutFree logo">
    </a>

    <button class="navbar-toggler ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto align-items-center">

            <li class="nav-item">
                <form th:action="@{/aboutus}" method="GET">
                    <button type="submit" class="btn btn-outline-success nav-link text-darkgreen border-1 border-darkgreen bg-white text-center active h5">
                        За Нас
                    </button>
                </form>
            </li>

            <li class="nav-item">
                <a class="px-2" href="https://www.facebook.com/www.glutfree.eu">
                    <img class="p-0" src="/img/logo-fb.png" alt="Facebook" style="height: 40px; width: 40px;">
                </a>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                <div class="dropdown">
                    <button class="btn btn-secondary text-darkgreen border-1 bg-white dropdown-toggle" type="button"
                            id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Admin Panel
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item text-darkgreen" href="/food/add">Добави храна</a>
                        <a class="dropdown-item text-darkgreen" href="/receipt/add">Добави Рецепта</a>
                        <a class="dropdown-item text-darkgreen" href="/feedback/add">Добави feedback</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-darkgreen" href="/store/add">Add Store</a>
                        <a class="dropdown-item text-darkgreen" href="/roles/add">Add Role to User</a>
                        <a class="dropdown-item text-darkgreen" href="/roles/delete">Delete User Role</a>
                        <a class="dropdown-item text-darkgreen" href="/users/delete">Delete User</a>
                    </div>
                </div>
            </li>

            <li class="nav-item" sec:authorize="isAuthenticated()">
                <div class="dropdown">
                    <button class="btn btn-secondary text-darkgreen border-1 bg-white dropdown-toggle" type="button"
                            id="dropdownMenuButtonProfile" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Профил
                    </button>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButtonProfile">
                        <form th:action="@{/users/update}" method="GET">
                            <button type="submit" class="dropdown-item text-darkgreen bg-white">
                                Допълни профила
                            </button>
                        </form>
                        <form th:action="@{/logout}" method="POST">
                            <button type="submit" class="dropdown-item text-darkgreen bg-white">
                                Изход
                            </button>
                        </form>
                    </div>
                </div>
            </li>

        </ul>
    </div>
</nav>
